<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="owlBodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5DEB3" />
      <stop offset="100%" style="stop-color:#D2B48C" />
    </linearGradient>
    <linearGradient id="owlHeadGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8E7C5" />
      <stop offset="100%" style="stop-color:#F5DEB3" />
    </linearGradient>
    <linearGradient id="bellyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF" />
      <stop offset="100%" style="stop-color:#FDF5E6" />
    </linearGradient>
    <linearGradient id="branchGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513" />
      <stop offset="100%" style="stop-color:#A0522D" />
    </linearGradient>
    <linearGradient id="blackboardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50" />
      <stop offset="100%" style="stop-color:#66BB6A" />
    </linearGradient>
    <linearGradient id="blackboardFrameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CD853F" />
      <stop offset="100%" style="stop-color:#DAA520" />
    </linearGradient>
  </defs>

  <!-- White Background -->
  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <!-- Branch -->
  <rect x="150" y="320" width="400" height="30" rx="15" ry="15" fill="url(#branchGradient)"/>

  <!-- Blackboard Frame -->
  <rect x="480" y="100" width="250" height="200" rx="20" ry="20" fill="url(#blackboardFrameGradient)"/>
  <!-- Blackboard Surface (Greenish tint) -->
  <rect x="500" y="115" width="210" height="170" rx="10" ry="10" fill="url(#blackboardGradient)"/>

  <!-- Question Mark on Blackboard -->
  <path d="M570 145 C570 135 578 130 585 130 C592 130 600 135 600 145 C600 155 595 160 590 165 C580 175 570 185 570 200 L570 210 Q570 215 575 215 H585 Q590 215 590 210 L590 200 C590 190 595 185 605 175 C615 165 620 155 620 145 C620 125 605 110 585 110 C565 110 550 125 550 145 M580 230 C575 230 570 235 570 240 C570 245 575 250 580 250 C585 250 590 245 590 240 C590 235 585 230 580 230 Z" fill="#FFFFFF"/>

  <!-- Owl Body -->
  <ellipse cx="300" cy="270" rx="80" ry="100" fill="url(#owlBodyGradient)"/>
  <!-- Owl Belly -->
  <ellipse cx="300" cy="280" rx="60" ry="70" fill="url(#bellyGradient)"/>

  <!-- Owl Head -->
  <circle cx="300" cy="180" r="70" fill="url(#owlHeadGradient)"/>

  <!-- Owl Eyes (Face Discs) -->
  <circle cx="280" cy="175" r="30" fill="#FFFFFF"/>
  <circle cx="320" cy="175" r="30" fill="#FFFFFF"/>

  <!-- Thick-rimmed glasses -->
  <path d="M260 175 A30 30 0 0 1 290 175 A30 30 0 0 1 260 175 Z M270 175 A20 20 0 0 0 290 175 A20 20 0 0 0 270 175 Z" fill="#333333"/>
  <path d="M300 175 A30 30 0 0 1 330 175 A30 30 0 0 1 300 175 Z M310 175 A20 20 0 0 0 330 175 A20 20 0 0 0 310 175 Z" fill="#333333"/>
  <!-- Bridge of glasses -->
  <rect x="290" y="173" width="20" height="4" rx="2" ry="2" fill="#333333"/>

  <!-- Owl Pupils -->
  <circle cx="280" cy="175" r="10" fill="#333333"/>
  <circle cx="320" cy="175" r="10" fill="#333333"/>
  <!-- Pupil highlights -->
  <circle cx="277" cy="172" r="3" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="317" cy="172" r="3" fill="#FFFFFF" opacity="0.7"/>

  <!-- Owl Beak -->
  <path d="M295 195 L305 195 L300 205 Z" fill="#CD853F"/>

  <!-- Owl Feet -->
  <path d="M275 315 Q280 325 290 320 Q285 330 275 320 Z" fill="#CD853F"/>
  <path d="M305 315 Q310 325 320 320 Q315 330 305 320 Z" fill="#CD853F"/>

  <!-- Owl Wings -->
  <path d="M220 240 C200 220 200 270 250 300 C250 300 220 270 220 240 Z" fill="url(#owlBodyGradient)"/>
  <path d="M380 240 C400 220 400 270 350 300 C350 300 380 270 380 240 Z" fill="url(#owlBodyGradient)"/>

  <!-- Pointing Wing (right wing from owl's perspective) -->
  <path d="M370 250 C385 240 400 260 410 270 L420 280 C430 290 440 295 450 290 L455 285 L445 275 C435 265 425 260 415 255 L400 245 C390 235 375 240 370 250 Z" fill="url(#owlBodyGradient)"/>
  <!-- Shadow/Detail for pointing wing -->
  <path d="M455 285 L450 290 L445 275 L455 285 Z" fill="#D2B48C" opacity="0.8"/>

</svg>