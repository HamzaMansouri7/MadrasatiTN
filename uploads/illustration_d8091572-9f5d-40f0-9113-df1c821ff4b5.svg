<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Skin color gradient -->
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe0b2" />
      <stop offset="100%" style="stop-color:#ffcc80" />
    </linearGradient>

    <!-- Hair color for boys (dark brown) -->
    <linearGradient id="hairGradientBoy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5c3317" />
      <stop offset="100%" style="stop-color:#4a2c13" />
    </linearGradient>

    <!-- Hair color for girl (medium brown) -->
    <linearGradient id="hairGradientGirl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513" />
      <stop offset="100%" style="stop-color:#A0522D" />
    </linearGradient>

    <!-- Green shirt gradient -->
    <linearGradient id="greenShirtGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8bc34a" />
      <stop offset="100%" style="stop-color:#689f38" />
    </linearGradient>

    <!-- Yellow dress gradient -->
    <linearGradient id="yellowDressGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffeb3b" />
      <stop offset="100%" style="stop-color:#fbc02d" />
    </linearGradient>

    <!-- Red shirt gradient -->
    <linearGradient id="redShirtGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef5350" />
      <stop offset="100%" style="stop-color:#d32f2f" />
    </linearGradient>

    <!-- Trousers gradient (blue) -->
    <linearGradient id="blueTrousersGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64b5f6" />
      <stop offset="100%" style="stop-color:#2196f3" />
    </linearGradient>

    <!-- Shoe gradient (dark grey) -->
    <linearGradient id="shoeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#757575" />
      <stop offset="100%" style="stop-color:#424242" />
    </linearGradient>

    <!-- Mouth red gradient -->
    <linearGradient id="mouthGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8a80" />
      <stop offset="100%" style="stop-color:#ff5252" />
    </linearGradient>
  </defs>

  <!-- White background (implicit, as nothing is drawn here) -->

  <!-- Child 1: Boy with Green Shirt (Left) -->
  <g transform="translate(150, 0)">
    <!-- Body -->
    <rect x="100" y="270" width="80" height="80" rx="20" ry="20" fill="url(#greenShirtGradient)" />
    <!-- Head -->
    <circle cx="140" cy="200" r="50" fill="url(#skinGradient)" />
    <!-- Hair -->
    <path d="M90 190 Q90 150 140 150 Q190 150 190 190 A50 50 0 0 1 140 250 A50 50 0 0 1 90 190 Z" fill="url(#hairGradientBoy)" />
    <!-- Face features -->
    <circle cx="125" cy="190" r="5" fill="#333" />
    <circle cx="155" cy="190" r="5" fill="#333" />
    <path d="M125 215 A20 20 0 0 0 155 215" stroke="url(#mouthGradient)" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Ears -->
    <ellipse cx="85" cy="200" rx="8" ry="12" fill="url(#skinGradient)" />
    <ellipse cx="195" cy="200" rx="8" ry="12" fill="url(#skinGradient)" />
    <!-- Arms -->
    <rect x="70" y="275" width="40" height="60" rx="10" ry="10" fill="url(#skinGradient)" transform="rotate(-15 70 275)" />
    <rect x="170" y="275" width="40" height="60" rx="10" ry="10" fill="url(#skinGradient)" transform="rotate(15 170 275)" />
    <!-- Hands -->
    <circle cx="70" cy="325" r="15" fill="url(#skinGradient)" />
    <circle cx="210" cy="325" r="15" fill="url(#skinGradient)" />
    <!-- Trousers -->
    <rect x="100" y="340" width="80" height="50" rx="15" ry="15" fill="url(#blueTrousersGradient)" />
    <!-- Legs -->
    <rect x="105" y="380" width="30" height="40" rx="10" ry="10" fill="url(#skinGradient)" />
    <rect x="145" y="380" width="30" height="40" rx="10" ry="10" fill="url(#skinGradient)" />
    <!-- Shoes -->
    <ellipse cx="120" cy="430" rx="20" ry="10" fill="url(#shoeGradient)" />
    <ellipse cx="160" cy="430" rx="20" ry="10" fill="url(#shoeGradient)" />
  </g>

  <!-- Child 2: Girl with Yellow Dress (Middle) -->
  <g transform="translate(0, 0)">
    <!-- Body (dress) -->
    <path d="M375 270 Q370 250 425 250 Q480 250 475 270 L490 350 Q495 380 450 390 Q400 400 350 390 Q305 380 310 350 Z" fill="url(#yellowDressGradient)" />
    <!-- Head -->
    <circle cx="425" cy="200" r="50" fill="url(#skinGradient)" />
    <!-- Hair -->
    <path d="M375 180 Q375 140 425 140 Q475 140 475 180 V220 C475 235 460 250 445 250 C430 250 420 235 420 220 V200 Z" fill="url(#hairGradientGirl)" />
    <path d="M375 180 V220 C375 235 390 250 405 250 C420 250 430 235 430 220 V200 Z" fill="url(#hairGradientGirl)" />
    <!-- Face features -->
    <circle cx="410" cy="190" r="5" fill="#333" />
    <circle cx="440" cy="190" r="5" fill="#333" />
    <path d="M410 215 A20 20 0 0 0 440 215" stroke="url(#mouthGradient)" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Ears -->
    <ellipse cx="370" cy="200" rx="8" ry="12" fill="url(#skinGradient)" />
    <ellipse cx="480" cy="200" rx="8" ry="12" fill="url(#skinGradient)" />
    <!-- Arms -->
    <rect x="340" y="275" width="40" height="60" rx="10" ry="10" fill="url(#skinGradient)" transform="rotate(-10 340 275)" />
    <rect x="470" y="275" width="40" height="60" rx="10" ry="10" fill="url(#skinGradient)" transform="rotate(10 470 275)" />
    <!-- Hands -->
    <circle cx="340" cy="325" r="15" fill="url(#skinGradient)" />
    <circle cx="510" cy="325" r="15" fill="url(#skinGradient)" />
    <!-- Legs (bare) -->
    <rect x="390" y="380" width="30" height="40" rx="10" ry="10" fill="url(#skinGradient)" />
    <rect x="430" y="380" width="30" height="40" rx="10" ry="10" fill="url(#skinGradient)" />
    <!-- Shoes -->
    <ellipse cx="405" cy="430" rx="20" ry="10" fill="url(#shoeGradient)" />
    <ellipse cx="445" cy="430" rx="20" ry="10" fill="url(#shoeGradient)" />
  </g>

  <!-- Child 3: Boy with Red Shirt (Right) -->
  <g transform="translate(450, 0)">
    <!-- Body -->
    <rect x="100" y="270" width="80" height="80" rx="20" ry="20" fill="url(#redShirtGradient)" />
    <!-- Head -->
    <circle cx="140" cy="200" r="50" fill="url(#skinGradient)" />
    <!-- Hair -->
    <path d="M90 190 Q90 150 140 150 Q190 150 190 190 A50 50 0 0 1 140 250 A50 50 0 0 1 90 190 Z" fill="url(#hairGradientBoy)" />
    <!-- Face features -->
    <circle cx="125" cy="190" r="5" fill="#333" />
    <circle cx="155" cy="190" r="5" fill="#333" />
    <path d="M125 215 A20 20 0 0 0 155 215" stroke="url(#mouthGradient)" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Ears -->
    <ellipse cx="85" cy="200" rx="8" ry="12" fill="url(#skinGradient)" />
    <ellipse cx="195" cy="200" rx="8" ry="12" fill="url(#skinGradient)" />
    <!-- Arms -->
    <rect x="70" y="275" width="40" height="60" rx="10" ry="10" fill="url(#skinGradient)" transform="rotate(-15 70 275)" />
    <rect x="170" y="275" width="40" height="60" rx="10" ry="10" fill="url(#skinGradient)" transform="rotate(15 170 275)" />
    <!-- Hands -->
    <circle cx="70" cy="325" r="15" fill="url(#skinGradient)" />
    <circle cx="210" cy="325" r="15" fill="url(#skinGradient)" />
    <!-- Trousers -->
    <rect x="100" y="340" width="80" height="50" rx="15" ry="15" fill="url(#blueTrousersGradient)" />
    <!-- Legs -->
    <rect x="105" y="380" width="30" height="40" rx="10" ry="10" fill="url(#skinGradient)" />
    <rect x="145" y="380" width="30" height="40" rx="10" ry="10" fill="url(#skinGradient)" />
    <!-- Shoes -->
    <ellipse cx="120" cy="430" rx="20" ry="10" fill="url(#shoeGradient)" />
    <ellipse cx="160" cy="430" rx="20" ry="10" fill="url(#shoeGradient)" />
  </g>
</svg>