<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Skin Gradient -->
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFDBAC" />
      <stop offset="100%" style="stop-color:#FDD5AD" />
    </linearGradient>
    <!-- Hair Gradient -->
    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A0522D" />
      <stop offset="100%" style="stop-color:#8B4513" />
    </linearGradient>
    <!-- Blue Top Gradient -->
    <linearGradient id="blueTopGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ADD8E6" />
      <stop offset="100%" style="stop-color:#87CEEB" />
    </linearGradient>
    <!-- Yellow Shorts Gradient -->
    <linearGradient id="yellowShortsGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFEA00" />
      <stop offset="100%" style="stop-color:#FFD700" />
    </linearGradient>
    <!-- Thought Bubble Gradient -->
    <linearGradient id="thoughtBubbleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0FFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#B0E0E6;stop-opacity:0.9" />
    </linearGradient>
    <!-- Toy Gradients -->
    <linearGradient id="redToyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6347" />
      <stop offset="100%" style="stop-color:#E64A2F" />
    </linearGradient>
    <linearGradient id="greenToyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3CB371" />
      <stop offset="100%" style="stop-color:#2E8B57" />
    </linearGradient>
    <linearGradient id="orangeToyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500" />
      <stop offset="100%" style="stop-color:#CC8400" />
    </linearGradient>
    <linearGradient id="purpleToyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DA70D6" />
      <stop offset="100%" style="stop-color:#B15DC1" />
    </linearGradient>
    <!-- Flashback Colors -->
    <linearGradient id="blockRed" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#FFC0CB"/><stop offset="100%" style="stop-color:#E6B0C1"/></linearGradient>
    <linearGradient id="blockGreen" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#90EE90"/><stop offset="100%" style="stop-color:#80D080"/></linearGradient>
    <linearGradient id="blockYellow" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#FFD700"/><stop offset="100%" style="stop-color:#E0C000"/></linearGradient>
    <linearGradient id="tricycleRed" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#E64A2F"/><stop offset="100%" style="stop-color:#C03A2A"/></linearGradient>
    <linearGradient id="coneColor" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#D2B48C"/><stop offset="100%" style="stop-color:#C0A07A"/></linearGradient>
    <linearGradient id="iceCreamPink" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#FFC0CB"/><stop offset="100%" style="stop-color:#F0B0C1"/></linearGradient>
  </defs>

  <!-- Child -->
  <g id="child" transform="translate(380, 290)">
    <!-- Legs (shorts) -->
    <rect x="-40" y="30" width="80" height="50" rx="25" ry="25" fill="url(#yellowShortsGradient)" />
    <ellipse cx="-20" cy="70" rx="20" ry="15" fill="url(#yellowShortsGradient)" />
    <ellipse cx="20" cy="70" rx="20" ry="15" fill="url(#yellowShortsGradient)" />
    
    <!-- Torso (blue top) -->
    <rect x="-50" y="-10" width="100" height="70" rx="35" ry="35" fill="url(#blueTopGradient)" />
    
    <!-- Arms -->
    <rect x="-80" y="10" width="40" height="20" rx="10" ry="10" fill="url(#blueTopGradient)" transform="rotate(-15 -80 10)" />
    <circle cx="-95" cy="18" r="12" fill="url(#skinGradient)" /> <!-- Left Hand -->
    
    <rect x="40" y="10" width="40" height="20" rx="10" ry="10" fill="url(#blueTopGradient)" transform="rotate(15 40 10)" />
    <circle cx="95" cy="18" r="12" fill="url(#skinGradient)" /> <!-- Right Hand -->

    <!-- Head -->
    <circle cx="0" cy="-40" r="40" fill="url(#skinGradient)" />
    <!-- Hair -->
    <path d="M -40 -60 Q -30 -90 0 -80 Q 30 -90 40 -60 L 40 -40 A 40 40 0 0 1 -40 -40 Z" fill="url(#hairGradient)" />
    <!-- Ears -->
    <circle cx="-35" cy="-40" r="8" fill="url(#skinGradient)" />
    <circle cx="35" cy="-40" r="8" fill="url(#skinGradient)" />
    <!-- Eyes -->
    <circle cx="-15" cy="-45" r="4" fill="#333" />
    <circle cx="15" cy="-45" r="4" fill="#333" />
    <!-- Mouth -->
    <path d="M -15 -25 Q 0 -15 15 -25" stroke="#333" stroke-width="2" fill="none" />
  </g>

  <!-- Toys surrounding the child -->
  <g id="toys">
    <!-- Red Ball -->
    <circle cx="280" cy="390" r="25" fill="url(#redToyGradient)" />
    <circle cx="288" cy="382" r="7" fill="rgba(255,255,255,0.4)" />
    <!-- Green Block -->
    <rect x="310" y="400" width="40" height="40" rx="8" ry="8" fill="url(#greenToyGradient)" transform="rotate(-10 330 420)" />
    <!-- Orange Car -->
    <rect x="200" y="410" width="60" height="30" rx="10" ry="10" fill="url(#orangeToyGradient)" />
    <circle cx="215" cy="435" r="8" fill="#555" />
    <circle cx="245" cy="435" r="8" fill="#555" />
    <!-- Purple Star -->
    <path d="M 0 -20 L 5.88 -8.09 L 19.02 -6.18 L 9.51 3.09 L 11.76 16.18 L 0 10 L -11.76 16.18 L -9.51 3.09 L -19.02 -6.18 L -5.88 -8.09 Z" 
          fill="url(#purpleToyGradient)" transform="translate(500, 420) scale(1.2)" />
    <!-- Another Green Block -->
    <rect x="520" y="380" width="30" height="30" rx="5" ry="5" fill="url(#greenToyGradient)" transform="rotate(15 535 395)" />
    <!-- Another Red Toy (simple cone) -->
    <path d="M 550 420 L 580 420 L 565 390 Z" fill="url(#redToyGradient)" />
    <!-- Yellow Ring -->
    <circle cx="600" cy="400" r="20" fill="url(#yellowShortsGradient)" />
    <circle cx="600" cy="400" r="10" fill="white" />
  </g>

  <!-- Thought Bubble -->
  <g id="thoughtBubble">
    <!-- Main cloud -->
    <path d="M 450 60 Q 500 20 570 30 C 650 40 680 100 660 150 C 640 200 580 220 520 200 C 470 180 430 140 450 60 Z" fill="url(#thoughtBubbleGradient)" stroke="#CCC" stroke-width="2" />
    <!-- Connecting bubbles -->
    <circle cx="430" cy="200" r="15" fill="url(#thoughtBubbleGradient)" stroke="#CCC" stroke-width="2" />
    <circle cx="410" cy="230" r="10" fill="url(#thoughtBubbleGradient)" stroke="#CCC" stroke-width="2" />
    <circle cx="395" cy="250" r="7" fill="url(#thoughtBubbleGradient)" stroke="#CCC" stroke-width="2" />

    <!-- Flashback scenes inside the thought bubble -->
    <g transform="translate(480, 80) scale(0.6)">
      <!-- 1. Playing with building blocks -->
      <rect x="0" y="0" width="30" height="30" rx="5" ry="5" fill="url(#blockRed)" />
      <rect x="25" y="10" width="30" height="30" rx="5" ry="5" fill="url(#blockGreen)" />
      <rect x="10" y="-20" width="30" height="30" rx="5" ry="5" fill="url(#blockYellow)" />
      
      <!-- 2. Riding a small red tricycle -->
      <g transform="translate(100, 20)">
        <circle cx="0" cy="0" r="10" fill="#333" /> <!-- Front wheel -->
        <circle cx="30" cy="0" r="10" fill="#333" /> <!-- Back left wheel -->
        <rect x="-10" y="-15" width="50" height="10" fill="url(#tricycleRed)" rx="3" ry="3" /> <!-- Frame -->
        <rect x="15" y="-30" width="10" height="20" fill="url(#tricycleRed)" rx="3" ry="3" /> <!-- Seat post -->
        <rect x="10" y="-40" width="20" height="10" fill="url(#tricycleRed)" rx="3" ry="3" /> <!-- Seat -->
        <rect x="-5" y="-25" width="5" height="15" fill="url(#tricycleRed)" rx="2" ry="2" /> <!-- Handlebar post -->
        <rect x="-15" y="-35" width="20" height="5" fill="url(#tricycleRed)" rx="2" ry="2" /> <!-- Handlebars -->
        <path d="M 10 -45 Q 15 -55 20 -45 L 20 -35 Q 15 -25 10 -35 Z" fill="url(#skinGradient)" /> <!-- Simple child head/body -->
      </g>
      
      <!-- 3. Eating a pink ice cream cone -->
      <g transform="translate(60, 100)">
        <path d="M 0 30 L 15 0 L 30 30 Z" fill="url(#coneColor)" /> <!-- Cone -->
        <circle cx="15" cy="-5" r="15" fill="url(#iceCreamPink)" /> <!-- Ice cream scoop -->
      </g>
    </g>
  </g>
</svg>