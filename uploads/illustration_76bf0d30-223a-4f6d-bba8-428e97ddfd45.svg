<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Main color palette -->
    <!-- #BBE5FB (Sky Blue) -->
    <!-- #FFC9E8 (Pink) -->
    <!-- #C8F6CD (Garden Green) -->
    <!-- #FFE8A6 (Sun Yellow) -->
    <!-- Outline color: #333333 -->

    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#BBE5FB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBE5FB;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="gardenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8F6CD;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#C8F6CD;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFE8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE8A6;stop-opacity:0.2" />
    </radialGradient>
    <linearGradient id="dressGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFC9E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC9E8;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="hatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE8A6;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="wateringCanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#99CCFF"/>
        <stop offset="100%" stop-color="#6699FF"/>
    </linearGradient>
    <radialGradient id="flowerCenterGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFE8A6"/>
      <stop offset="100%" stop-color="#FFDBAC"/>
    </radialGradient>
    <radialGradient id="butterflyWingGradientPink" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFC9E8"/>
      <stop offset="100%" stop-color="#FFAADD"/>
    </radialGradient>
    <radialGradient id="butterflyWingGradientBlue" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#BBE5FB"/>
      <stop offset="100%" stop-color="#88CCFF"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="300" fill="url(#skyGradient)" />

  <!-- Garden Ground -->
  <rect x="0" y="250" width="800" height="200" fill="url(#gardenGradient)" />

  <!-- Sun -->
  <circle cx="700" cy="80" r="60" fill="url(#sunGradient)" stroke="#FFE8A6" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Girl -->
  <g transform="translate(400, 200)"> <!-- Center of the girl -->

    <!-- Hair (behind hat) -->
    <path d="M-30 -50 Q -50 -80 -20 -100 Q 0 -110 20 -100 Q 50 -80 30 -50 Z" fill="#A0522D" stroke="#333333" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Hat (straw) -->
    <ellipse cx="0" cy="-80" rx="60" ry="20" fill="url(#hatGradient)" stroke="#333333" stroke-width="4"/> <!-- Brim -->
    <path d="M-40 -80 C -50 -130 50 -130 40 -80 Z" fill="url(#hatGradient)" stroke="#333333" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/> <!-- Crown -->

    <!-- Head -->
    <circle cx="0" cy="-60" r="30" fill="#FFDBAC" stroke="#333333" stroke-width="4"/>

    <!-- Face details -->
    <circle cx="-10" cy="-70" r="3" fill="#333333"/>
    <circle cx="10" cy="-70" r="3" fill="#333333"/>
    <path d="M-10 -50 Q 0 -40 10 -50" stroke="#333333" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Body / Dress -->
    <path d="M-40 -30 Q -60 50 0 100 Q 60 50 40 -30 Z" fill="url(#dressGradient)" stroke="#333333" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Legs -->
    <rect x="-20" y="80" width="15" height="30" rx="7" ry="7" fill="#FFDBAC" stroke="#333333" stroke-width="4"/>
    <rect x="5" y="80" width="15" height="30" rx="7" ry="7" fill="#FFDBAC" stroke="#333333" stroke-width="4"/>

    <!-- Shoes -->
    <ellipse cx="-12" cy="115" rx="12" ry="7" fill="#A0522D" stroke="#333333" stroke-width="4"/>
    <ellipse cx="13" cy="115" rx="12" ry="7" fill="#A0522D" stroke="#333333" stroke-width="4"/>

    <!-- Watering Can -->
    <g transform="translate(60, 40) rotate(30)">
        <rect x="-20" y="-30" width="40" height="40" rx="10" ry="10" fill="url(#wateringCanGradient)" stroke="#333333" stroke-width="4"/>
        <path d="M20 -20 Q 35 -25 30 -40 L 40 -40 L 45 -20 Z" fill="url(#wateringCanGradient)" stroke="#333333" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/> <!-- Spout -->
        <path d="M-10 -30 C -25 -40 -25 -5 0 -5 C 10 -5 10 -25 0 -30 Z" fill="none" stroke="url(#wateringCanGradient)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/> <!-- Handle -->
        <!-- Water drops -->
        <circle cx="45" cy="-10" r="3" fill="#BBE5FB"/>
        <circle cx="48" cy="-5" r="2" fill="#BBE5FB"/>
        <circle cx="50" cy="0" r="3" fill="#BBE5FB"/>
    </g>

    <!-- Arms (drawn OVER the watering can) -->
    <!-- Left Arm (Girl's Right, our left) - relaxed, slightly bent -->
    <path d="M-30 -20 Q -40 0 -40 20 Q -40 40 -20 40 Q 0 40 0 20 Q 0 0 -20 -20 Z" fill="#FFDBAC" stroke="#333333" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Right Arm (Girl's Left, our right) - holding the can -->
    <path d="M20 -20 Q 50 0 70 10 Q 80 20 75 30 Q 60 40 40 30 Q 30 20 20 0 Z" fill="#FFDBAC" stroke="#333333" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  </g>

  <!-- Flowers (various positions) -->
  <g class="flowers">
    <!-- Flower 1 (front-left) -->
    <g transform="translate(150, 380)">
      <rect x="-5" y="0" width="10" height="50" fill="#C8F6CD" stroke="#333333" stroke-width="3" rx="5" ry="5"/>
      <ellipse cx="0" cy="20" rx="15" ry="8" fill="#C8F6CD" stroke="#333333" stroke-width="2"/>
      <g transform="translate(0, -10)">
        <circle r="15" fill="#FFC9E8" stroke="#333333" stroke-width="2"/>
        <circle cx="10" r="15" fill="#FFC9E8" stroke="#333333" stroke-width="2"/>
        <circle cx="-10" r="15" fill="#FFC9E8" stroke="#333333" stroke-width="2"/>
        <circle cy="10" r="15" fill="#FFC9E8" stroke="#333333" stroke-width="2"/>
        <circle cy="-10" r="15" fill="#FFC9E8" stroke="#333333" stroke-width="2"/>
        <circle cx="0" cy="0" r="10" fill="url(#flowerCenterGradient)" stroke="#333333" stroke-width="2"/>
      </g>
    </g>

    <!-- Flower 2 (front-right) -->
    <g transform="translate(600, 390)">
      <rect x="-4" y="0" width="8" height="40" fill="#C8F6CD" stroke="#333333" stroke-width="3" rx="4" ry="4"/>
      <ellipse cx="0" cy="10" rx="12" ry="6" fill="#C8F6CD" stroke="#333333" stroke-width="2"/>
      <g transform="translate(0, -10)">
        <circle r="12" fill="#FFC9E8" stroke="#333333" stroke-width="2"/>
        <circle cx="8" r="12" fill="#FFC9E8" stroke="#333333" stroke-width="2"/>
        <circle cx="-8" r="12" fill="#FFC9E8" stroke="#333333" stroke-width="2"/>
        <circle cy="8" r="12" fill="#FFC9E8" stroke="#333333" stroke-width="2"/>
        <circle cy="-8" r="12" fill="#FFC9E8" stroke="#333333" stroke-width="2"/>
        <circle cx="0" cy="0" r="8" fill="url(#flowerCenterGradient)" stroke="#333333" stroke-width="2"/>
      </g>
    </g>

    <!-- Flower 3 (mid-left) -->
    <g transform="translate(250, 300)">
        <rect x="-3" y="0" width="6" height="30" fill="#C8F6CD" stroke="#333333" stroke-width="2" rx="3" ry="3"/>
        <ellipse cx="0" cy="15" rx="10" ry="5" fill="#C8F6CD" stroke="#333333" stroke-width="1.5"/>
        <g transform="translate(0, -10)">
            <circle r="10" fill="#FFC9E8" stroke="#333333" stroke-width="1.5"/>
            <circle cx="7" r="10" fill="#FFC9E8" stroke="#333333" stroke-width="1.5"/>
            <circle cx="-7" r="10" fill="#FFC9E8" stroke="#333333" stroke-width="1.5"/>
            <circle cy="7" r="10" fill="#FFC9E8" stroke="#333333" stroke-width="1.5"/>
            <circle cy="-7" r="10" fill="#FFC9E8" stroke="#333333" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="7" fill="url(#flowerCenterGradient)" stroke="#333333" stroke-width="1.5"/>
        </g>
    </g>

    <!-- Flower 4 (mid-right) -->
    <g transform="translate(500, 310)">
        <rect x="-3" y="0" width="6" height="35" fill="#C8F6CD" stroke="#333333" stroke-width="2" rx="3" ry="3"/>
        <ellipse cx="0" cy="10" rx="11" ry="5" fill="#C8F6CD" stroke="#333333" stroke-width="1.5"/>
        <g transform="translate(0, -10)">
            <circle r="11" fill="#FFC9E8" stroke="#333333" stroke-width="1.5"/>
            <circle cx="7.5" r="11" fill="#FFC9E8" stroke="#333333" stroke-width="1.5"/>
            <circle cx="-7.5" r="11" fill="#FFC9E8" stroke="#333333" stroke-width="1.5"/>
            <circle cy="7.5" r="11" fill="#FFC9E8" stroke="#333333" stroke-width="1.5"/>
            <circle cy="-7.5" r="11" fill="#FFC9E8" stroke="#333333" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="7.5" fill="url(#flowerCenterGradient)" stroke="#333333" stroke-width="1.5"/>
        </g>
    </g>
  </g>

  <!-- Butterflies -->
  <g class="butterflies">
    <!-- Butterfly 1 -->
    <g transform="translate(100, 150) scale(0.8)">
      <ellipse cx="0" cy="0" rx="5" ry="10" fill="#A0522D" stroke="#333333" stroke-width="2"/>
      <path d="M-5 -5 C -20 -20 -15 -35 0 -30 C 15 -35 20 -20 5 -5 Z" fill="url(#butterflyWingGradientPink)" stroke="#333333" stroke-width="2"/>
      <path d="M-5 5 C -15 20 -10 30 0 25 C 10 30 15 20 5 5 Z" fill="url(#butterflyWingGradientBlue)" stroke="#333333" stroke-width="2"/>
      <line x1="-3" y1="-10" x2="-10" y2="-20" stroke="#333333" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="-10" cy="-20" r="1.5" fill="#333333"/>
      <line x1="3" y1="-10" x2="10" y2="-20" stroke="#333333" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="10" cy="-20" r="1.5" fill="#333333"/>
    </g>

    <!-- Butterfly 2 -->
    <g transform="translate(700, 200) scale(0.7) rotate(15)">
      <ellipse cx="0" cy="0" rx="5" ry="10" fill="#A0522D" stroke="#333333" stroke-width="2"/>
      <path d="M-5 -5 C -20 -20 -15 -35 0 -30 C 15 -35 20 -20 5 -5 Z" fill="url(#butterflyWingGradientBlue)" stroke="#333333" stroke-width="2"/>
      <path d="M-5 5 C -15 20 -10 30 0 25 C 10 30 15 20 5 5 Z" fill="url(#butterflyWingGradientPink)" stroke="#333333" stroke-width="2"/>
      <line x1="-3" y1="-10" x2="-10" y2="-20" stroke="#333333" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="-10" cy="-20" r="1.5" fill="#333333"/>
      <line x1="3" y1="-10" x2="10" y2="-20" stroke="#333333" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="10" cy="-20" r="1.5" fill="#333333"/>
    </g>

    <!-- Butterfly 3 -->
    <g transform="translate(250, 100) scale(0.6) rotate(-10)">
      <ellipse cx="0" cy="0" rx="5" ry="10" fill="#A0522D" stroke="#333333" stroke-width="2"/>
      <path d="M-5 -5 C -20 -20 -15 -35 0 -30 C 15 -35 20 -20 5 -5 Z" fill="url(#butterflyWingGradientPink)" stroke="#333333" stroke-width="2"/>
      <path d="M-5 5 C -15 20 -10 30 0 25 C 10 30 15 20 5 5 Z" fill="url(#butterflyWingGradientPink)" stroke="#333333" stroke-width="2"/>
      <line x1="-3" y1="-10" x2="-10" y2="-20" stroke="#333333" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="-10" cy="-20" r="1.5" fill="#333333"/>
      <line x1="3" y1="-10" x2="10" y2="-20" stroke="#333333" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="10" cy="-20" r="1.5" fill="#333333"/>
    </g>
  </g>

</svg>