<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for background and elements -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A0D8EF"/>
      <stop offset="100%" stop-color="#7BC0E3"/>
    </linearGradient>
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8E6A6"/>
      <stop offset="100%" stop-color="#9ECC7F"/>
    </linearGradient>
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F4E3"/>
      <stop offset="100%" stop-color="#E3DDCB"/>
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDA47"/>
      <stop offset="100%" stop-color="#FF9A00"/>
    </linearGradient>
    <linearGradient id="palmTrunkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C28B5A"/>
      <stop offset="100%" stop-color="#A66D46"/>
    </linearGradient>
    <linearGradient id="palmLeafGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#79B864"/>
      <stop offset="100%" stop-color="#5E944C"/>
    </linearGradient>
    <linearGradient id="skinToneGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAD1B8"/>
      <stop offset="100%" stop-color="#E0B79E"/>
    </linearGradient>
    <linearGradient id="hairBoyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B4E3E"/>
      <stop offset="100%" stop-color="#4F382A"/>
    </linearGradient>
    <linearGradient id="hairGirlGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B08B6B"/>
      <stop offset="100%" stop-color="#9B7A5C"/>
    </linearGradient>
    <linearGradient id="bookRedGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E57373"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </linearGradient>
    <linearGradient id="bookBlueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6"/>
      <stop offset="100%" stop-color="#2196F3"/>
    </linearGradient>
    <linearGradient id="globeOceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A0D8EF"/>
      <stop offset="100%" stop-color="#7BC0E3"/>
    </linearGradient>
    <linearGradient id="globeLandGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B3DD9F"/>
      <stop offset="100%" stop-color="#8DC77F"/>
    </linearGradient>
    <linearGradient id="pencilYellowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
    <linearGradient id="pencilEraserGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCDD2"/>
      <stop offset="100%" stop-color="#EF9A9A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="250" fill="url(#skyGradient)"/>
  <rect x="0" y="250" width="800" height="200" fill="url(#groundGradient)"/>

  <!-- Sun -->
  <circle cx="700" cy="80" r="50" fill="url(#sunGradient)"/>
  <g transform="translate(700,80)">
    <rect x="-65" y="-5" width="30" height="10" rx="3" fill="#FFDA47" transform="rotate(0)"/>
    <rect x="-65" y="-5" width="30" height="10" rx="3" fill="#FFDA47" transform="rotate(45)"/>
    <rect x="-65" y="-5" width="30" height="10" rx="3" fill="#FFDA47" transform="rotate(90)"/>
    <rect x="-65" y="-5" width="30" height="10" rx="3" fill="#FFDA47" transform="rotate(135)"/>
    <rect x="-65" y="-5" width="30" height="10" rx="3" fill="#FFDA47" transform="rotate(180)"/>
    <rect x="-65" y="-5" width="30" height="10" rx="3" fill="#FFDA47" transform="rotate(225)"/>
    <rect x="-65" y="-5" width="30" height="10" rx="3" fill="#FFDA47" transform="rotate(270)"/>
    <rect x="-65" y="-5" width="30" height="10" rx="3" fill="#FFDA47" transform="rotate(315)"/>
  </g>

  <!-- Stylized School Building with Tunisian Flag -->
  <g transform="translate(500, 150)">
    <rect x="-100" y="50" width="200" height="150" rx="15" fill="url(#buildingGradient)"/>
    <rect x="-120" y="100" width="240" height="100" rx="10" fill="#F8F4E3" opacity="0.8"/>
    <rect x="-70" y="70" width="40" height="60" rx="8" fill="#B0BEC5"/> <!-- Window 1 -->
    <rect x="30" y="70" width="40" height="60" rx="8" fill="#B0BEC5"/> <!-- Window 2 -->
    <path d="M-40 50 L40 50 L40 0 C40 -20 0 -20 -40 0 Z" fill="#E3DDCB" stroke="#B0BEC5" stroke-width="2"/> <!-- Roof detail -->
    <path d="M-10 200 L10 200 L10 130 C10 110 -10 110 -10 130 Z" fill="#D32F2F" stroke="#A66D46" stroke-width="2"/> <!-- Door -->

    <!-- Tunisian Flag on building (small, stylized) -->
    <g transform="translate(60, -10)"> <!-- Positioned on the roof, right side -->
      <rect x="-15" y="-15" width="30" height="20" fill="#D32F2F" rx="3"/> <!-- Red background, rounded -->
      <circle cx="0" cy="-5" r="7" fill="#FFFFFF"/> <!-- White circle (center of flag symbol) -->
      <!-- Simplified red crescent inside white circle -->
      <path d="M-3 -5 A3 3 0 1 1 -3 0 L-2 0 A2 2 0 1 0 -2 -5 Z" fill="#D32F2F" transform="translate(0, -5)"/>
      <!-- Simplified red star inside white circle -->
      <path d="M0 -3 L0.5 -1 L2 -1 L1 0.5 L1.5 2 L0 1 L-1.5 2 L-1 0.5 L-2 -1 L-0.5 -1 Z" fill="#D32F2F" transform="translate(0.5, -5) scale(0.8)"/>
    </g>
  </g>

  <!-- Palm Tree -->
  <g transform="translate(100, 150)">
    <path d="M-15 0 C-25 50 -20 100 -10 150 C0 200 15 250 15 250 L10 0 Z" fill="url(#palmTrunkGradient)" stroke="#A66D46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Leaves -->
    <ellipse cx="0" cy="-20" rx="35" ry="15" transform="rotate(0)" fill="url(#palmLeafGradient)"/>
    <ellipse cx="0" cy="-20" rx="35" ry="15" transform="rotate(45)" fill="url(#palmLeafGradient)"/>
    <ellipse cx="0" cy="-20" rx="35" ry="15" transform="rotate(90)" fill="url(#palmLeafGradient)"/>
    <ellipse cx="0" cy="-20" rx="35" ry="15" transform="rotate(135)" fill="url(#palmLeafGradient)"/>
    <ellipse cx="0" cy="-20" rx="35" ry="15" transform="rotate(180)" fill="url(#palmLeafGradient)"/>
    <ellipse cx="0" cy="-20" rx="35" ry="15" transform="rotate(225)" fill="url(#palmLeafGradient)"/>
    <ellipse cx="0" cy="-20" rx="35" ry="15" transform="rotate(270)" fill="url(#palmLeafGradient)"/>
    <ellipse cx="0" cy="-20" rx="35" ry="15" transform="rotate(315)" fill="url(#palmLeafGradient)"/>
  </g>

  <!-- Children and Learning Objects -->
  <g transform="translate(400, 250)">
    <!-- Boy (right) -->
    <g transform="translate(70, 0)">
      <!-- Body -->
      <rect x="-30" y="60" width="60" height="80" rx="20" fill="#81D4FA"/> <!-- Shirt -->
      <rect x="-25" y="125" width="50" height="50" rx="10" fill="#FFAB91"/> <!-- Shorts -->
      <rect x="-20" y="170" width="15" height="30" rx="5" fill="#E0E0E0"/> <!-- Leg 1 -->
      <rect x="5" y="170" width="15" height="30" rx="5" fill="#E0E0E0"/> <!-- Leg 2 -->
      <circle cx="-12" cy="200" r="10" fill="#B0BEC5"/> <!-- Shoe 1 -->
      <circle cx="12" cy="200" r="10" fill="#B0BEC5"/> <!-- Shoe 2 -->
      
      <!-- Head -->
      <circle cx="0" cy="50" r="35" fill="url(#skinToneGradient)"/>
      <path d="M-25 35 C-10 20 10 20 25 35 L25 50 C25 65 -25 65 -25 50 Z" fill="url(#hairBoyGradient)"/> <!-- Hair -->
      
      <!-- Face -->
      <circle cx="-12" cy="45" r="3" fill="#424242"/> <!-- Eye 1 -->
      <circle cx="12" cy="45" r="3" fill="#424242"/> <!-- Eye 2 -->
      <path d="M-18 38 Q-12 35 -6 38" stroke="#424242" stroke-width="1.5" fill="none"/> <!-- Eyebrow 1 -->
      <path d="M6 38 Q12 35 18 38" stroke="#424242" stroke-width="1.5" fill="none"/> <!-- Eyebrow 2 -->
      <path d="M-15 60 Q0 70 15 60" stroke="#424242" stroke-width="2" fill="none"/> <!-- Mouth -->

      <!-- Arm pointing to globe -->
      <rect x="25" y="80" width="40" height="15" rx="7" fill="#81D4FA" transform="rotate(-20, 25, 80)"/> <!-- Arm -->
      <circle cx="60" cy="70" r="12" fill="url(#skinToneGradient)"/> <!-- Hand -->
      <path d="M60 60 Q65 65 70 65 L70 55 Q65 50 60 55 Z" fill="url(#skinToneGradient)"/> <!-- Finger pointing -->
    </g>

    <!-- Girl (left) -->
    <g transform="translate(-70, 0)">
      <!-- Body -->
      <rect x="-30" y="60" width="60" height="80" rx="20" fill="#FFAB91"/> <!-- Dress top -->
      <rect x="-40" y="110" width="80" height="70" rx="20" fill="#FFCDD2"/> <!-- Dress skirt -->
      <rect x="-20" y="170" width="15" height="30" rx="5" fill="#E0E0E0"/> <!-- Leg 1 -->
      <rect x="5" y="170" width="15" height="30" rx="5" fill="#E0E0E0"/> <!-- Leg 2 -->
      <circle cx="-12" cy="200" r="10" fill="#B0BEC5"/> <!-- Shoe 1 -->
      <circle cx="12" cy="200" r="10" fill="#B0BEC5"/> <!-- Shoe 2 -->

      <!-- Head -->
      <circle cx="0" cy="50" r="35" fill="url(#skinToneGradient)"/>
      <path d="M-30 40 C-15 25 15 25 30 40 L30 55 C30 70 -30 70 -30 55 Z" fill="url(#hairGirlGradient)"/> <!-- Hair -->
      <circle cx="20" cy="35" r="10" fill="url(#hairGirlGradient)"/> <!-- Hair bun/side part -->
      
      <!-- Face -->
      <circle cx="-12" cy="45" r="3" fill="#424242"/> <!-- Eye 1 -->
      <circle cx="12" cy="45" r="3" fill="#424242"/> <!-- Eye 2 -->
      <path d="M-18 38 Q-12 35 -6 38" stroke="#424242" stroke-width="1.5" fill="none"/> <!-- Eyebrow 1 -->
      <path d="M6 38 Q12 35 18 38" stroke="#424242" stroke-width="1.5" fill="none"/> <!-- Eyebrow 2 -->
      <path d="M-15 60 Q0 70 15 60" stroke="#424242" stroke-width="2" fill="none"/> <!-- Mouth -->

      <!-- Arm holding book -->
      <rect x="-60" y="80" width="40" height="15" rx="7" fill="#FFAB91" transform="rotate(20, -20, 80)"/> <!-- Arm -->
      <circle cx="-50" cy="90" r="12" fill="url(#skinToneGradient)"/> <!-- Hand -->
    </g>

    <!-- Globe (center) -->
    <g transform="translate(0, 100)">
      <circle cx="0" cy="0" r="50" fill="url(#globeOceanGradient)"/>
      <!-- Simplified continents -->
      <path d="M-30 -20 Q-40 0 -20 30 Q0 40 20 20 Q30 0 10 -20 Q-10 -30 -30 -20 Z" fill="url(#globeLandGradient)"/>
      <path d="M10 30 Q-5 45 -20 40 Q-30 20 -15 10 Q-5 0 10 30 Z" fill="url(#globeLandGradient)"/>
      <path d="M30 0 Q40 -10 25 -30 Q10 -40 -5 -20 Q10 0 30 0 Z" fill="url(#globeLandGradient)"/>
      <!-- Stand -->
      <rect x="-10" y="50" width="20" height="30" rx="5" fill="#A66D46"/>
      <ellipse cx="0" cy="80" rx="20" ry="8" fill="#A66D46"/>
    </g>

    <!-- Books (stacked near girl, one in hand) -->
    <g transform="translate(-150, 150)">
      <rect x="0" y="0" width="50" height="70" rx="8" fill="url(#bookRedGradient)"/>
      <rect x="10" y="-15" width="50" height="70" rx="8" fill="url(#bookBlueGradient)" transform="rotate(-5, 10, -15)"/>
      <rect x="20" y="-30" width="50" height="70" rx="8" fill="url(#bookRedGradient)" transform="rotate(5, 20, -30)"/>
      <!-- Top book for the girl to hold -->
      <rect x="-10" y="-45" width="50" height="70" rx="8" fill="#FFFFFF" stroke="#D32F2F" stroke-width="2" transform="rotate(-10, -10, -45)"/>
      <text x="14" y="-12" font-family="Arial, sans-serif" font-size="16" fill="#D32F2F" text-anchor="middle" transform="rotate(-10, -10, -45)">A B C</text>
    </g>

    <!-- Pencil (near boy) -->
    <g transform="translate(180, 150) rotate(-20)">
      <rect x="0" y="0" width="80" height="15" rx="7" fill="url(#pencilYellowGradient)"/>
      <path d="M80 0 L100 7.5 L80 15 Z" fill="#6D4C41"/> <!-- Tip -->
      <rect x="-15" y="0" width="15" height="15" rx="7" fill="url(#pencilEraserGradient)"/> <!-- Eraser -->
    </g>
  </g>

  <!-- Title and Message -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#333333" text-anchor="middle">
    Bienvenue à l'école !
  </text>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="20" fill="#333333" text-anchor="middle">
    Apprenons et grandissons ensemble
  </text>
</svg>