<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <!-- Smooth linear gradient for skin tone -->
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFDAB9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0C49E;stop-opacity:1" />
    </linearGradient>
    <!-- Smooth linear gradient for blue t-shirt -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
    <!-- Smooth linear gradient for brown hair -->
    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7B5B3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A402D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main group for the boy, transformed to center him on the canvas -->
  <!-- The boy is roughly 335px tall from hair top to feet bottom. -->
  <!-- Centered horizontally at 400px. Feet at y=355px, head top at y=30px. -->
  <g id="boy" transform="translate(400 100)">
    <!-- Hair (drawn before the head circle to appear behind the face edges) -->
    <path d="M-55 -25 Q-70 -40 -30 -65 Q0 -75 30 -65 Q70 -40 55 -25 L50 10 A50 50 0 0 1 -50 10 Z" fill="url(#hairGradient)"/>

    <!-- Head (main face shape) -->
    <circle cx="0" cy="0" r="50" fill="url(#skinGradient)"/>

    <!-- Ears -->
    <ellipse cx="-55" cy="5" rx="8" ry="15" fill="url(#skinGradient)"/>
    <ellipse cx="55" cy="5" rx="8" ry="15" fill="url(#skinGradient)"/>

    <!-- Face features -->
    <g id="face-features">
      <!-- Eyes (simple black circles) -->
      <circle cx="-20" cy="-10" r="5" fill="#333333"/>
      <circle cx="20" cy="-10" r="5" fill="#333333"/>
      <!-- Nose (subtle skin-toned circle) -->
      <circle cx="0" cy="10" r="3" fill="#F0C49E"/>
      <!-- Mouth (simple smiling arc) -->
      <path d="M-25 25 Q 0 40 25 25" stroke="#333333" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Neck -->
    <rect x="-15" y="50" width="30" height="20" rx="10" ry="10" fill="url(#skinGradient)"/>

    <!-- T-shirt body (rounded rectangle) -->
    <rect x="-60" y="70" width="120" height="90" rx="20" ry="20" fill="url(#blueGradient)"/>

    <!-- Arms (rounded rectangles, slightly rotated for a natural pose) -->
    <!-- Left arm -->
    <rect x="-85" y="85" width="25" height="70" rx="12" ry="12" fill="url(#skinGradient)" transform="rotate(-15 -85 85)"/>
    <!-- Right arm -->
    <rect x="60" y="85" width="25" height="70" rx="12" ry="12" fill="url(#skinGradient)" transform="rotate(15 85 85)"/>

    <!-- Hands (rounded circles) -->
    <!-- Left hand -->
    <circle cx="-95" cy="150" r="15" fill="url(#skinGradient)"/>
    <!-- Right hand -->
    <circle cx="95" cy="150" r="15" fill="url(#skinGradient)"/>

    <!-- Legs (rounded rectangles) -->
    <!-- Left leg -->
    <rect x="-40" y="170" width="30" height="80" rx="15" ry="15" fill="url(#skinGradient)"/>
    <!-- Right leg -->
    <rect x="10" y="170" width="30" height="80" rx="15" ry="15" fill="url(#skinGradient)"/>

    <!-- Feet (rounded ellipses) -->
    <!-- Left foot -->
    <ellipse cx="-25" cy="255" rx="20" ry="10" fill="url(#skinGradient)"/>
    <!-- Right foot -->
    <ellipse cx="25" cy="255" rx="20" ry="10" fill="url(#skinGradient)"/>
  </g>
</svg>