<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB" /> <!-- Sky Blue -->
      <stop offset="100%" stop-color="#E0F2F7" /> <!-- Very Light Blue -->
    </linearGradient>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFD700" /> <!-- Gold -->
      <stop offset="100%" stop-color="#FFA500" /> <!-- Orange -->
    </radialGradient>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" /> <!-- White -->
      <stop offset="100%" stop-color="#F0F8FF" /> <!-- Alice Blue -->
    </linearGradient>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E90FF" /> <!-- Dodger Blue -->
      <stop offset="100%" stop-color="#87CEFA" /> <!-- Light Sky Blue -->
    </linearGradient>
    <linearGradient id="landGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B8E23" /> <!-- Olive Drab -->
      <stop offset="100%" stop-color="#9ACD32" /> <!-- Yellow Green -->
    </linearGradient>

    <!-- Raindrop symbol -->
    <symbol id="raindrop" viewBox="0 0 10 15">
        <path d="M5 0 L10 10 Q5 15 0 10 Z" fill="#6495ED" /> <!-- Cornflower Blue -->
    </symbol>

    <!-- Evaporation Arrowhead -->
    <marker id="evapArrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto" fill="#ADD8E6">
      <polygon points="0 0, 6 2, 0 4" />
    </marker>

    <!-- Runoff Arrowhead -->
    <marker id="runoffArrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto" fill="#6495ED">
      <polygon points="0 0, 6 2, 0 4" />
    </marker>

  </defs>

  <!-- Sky background -->
  <rect x="0" y="0" width="800" height="450" fill="url(#skyGradient)" />

  <!-- Sun -->
  <circle cx="700" cy="80" r="60" fill="url(#sunGradient)" />
  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="3" stroke-linecap="round">
    <line x1="660" y1="40" x2="680" y2="60" />
    <line x1="740" y1="40" x2="720" y2="60" />
    <line x1="650" y1="90" x2="670" y2="90" />
    <line x1="750" y1="90" x2="730" y2="90" />
    <line x1="660" y1="140" x2="680" y2="120" />
    <line x1="740" y1="140" x2="720" y2="120" />
  </g>

  <!-- Land (hills) -->
  <path d="M0 300 Q100 250 200 300 T400 300 T600 280 T800 320 L800 450 L0 450 Z" fill="url(#landGradient)" />

  <!-- Water body (lake/sea) -->
  <path d="M0 350 Q200 380 400 350 T600 370 T800 340 L800 450 L0 450 Z" fill="url(#waterGradient)" />

  <!-- Clouds -->
  <!-- Cloud 1 (evaporation source) -->
  <ellipse cx="200" cy="180" rx="60" ry="30" fill="url(#cloudGradient)" />
  <ellipse cx="240" cy="170" rx="50" ry="25" fill="url(#cloudGradient)" />
  <ellipse cx="170" cy="190" rx="40" ry="20" fill="url(#cloudGradient)" />

  <!-- Cloud 2 (main cloud for rain) -->
  <ellipse cx="400" cy="100" rx="100" ry="50" fill="url(#cloudGradient)" />
  <ellipse cx="460" cy="110" rx="80" ry="40" fill="url(#cloudGradient)" />
  <ellipse cx="340" cy="110" rx="80" ry="40" fill="url(#cloudGradient)" />

  <!-- Cloud 3 (condensation) -->
  <ellipse cx="600" cy="180" rx="70" ry="35" fill="url(#cloudGradient)" />
  <ellipse cx="640" cy="170" rx="60" ry="30" fill="url(#cloudGradient)" />

  <!-- Water cycle arrows/lines -->

  <!-- Evaporation from water -->
  <path d="M200 370 Q210 330 230 310 Q250 290 270 270" fill="none" stroke="#ADD8E6" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#evapArrow)" />
  <path d="M220 380 Q230 340 250 320 Q270 300 290 280" fill="none" stroke="#ADD8E6" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#evapArrow)" />
  <path d="M240 390 Q250 350 270 330 Q290 310 310 290" fill="none" stroke="#ADD8E6" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#evapArrow)" />

  <!-- Transport/Condensation towards cloud -->
  <path d="M290 280 C320 250 350 200 380 150" fill="none" stroke="#ADD8E6" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#evapArrow)" />

  <!-- Precipitation (Rain) from main cloud -->
  <use href="#raindrop" x="380" y="160" transform="scale(0.8)" />
  <use href="#raindrop" x="420" y="170" transform="scale(0.9)" />
  <use href="#raindrop" x="395" y="190" transform="scale(1)" />
  <use href="#raindrop" x="440" y="180" transform="scale(0.7)" />
  <use href="#raindrop" x="410" y="210" transform="scale(1.1)" />
  <use href="#raindrop" x="370" y="190" transform="scale(0.95)" />
  <!-- Rain falling on land -->
  <use href="#raindrop" x="490" y="160" transform="scale(0.8)" />
  <use href="#raindrop" x="520" y="170" transform="scale(0.9)" />

  <!-- Runoff from land to water -->
  <!-- Path 1 -->
  <path d="M400 310 Q380 330 350 345 Q320 355 290 360" fill="none" stroke="#6495ED" stroke-width="6" stroke-linecap="round" marker-end="url(#runoffArrow)" />
  <!-- Path 2 -->
  <path d="M500 300 Q480 320 450 335 Q420 345 390 350" fill="none" stroke="#6495ED" stroke-width="6" stroke-linecap="round" marker-end="url(#runoffArrow)" />


  <!-- Text for main title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#333" text-anchor="middle">Le Cycle de l'Eau</text>
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="16" fill="#555" text-anchor="middle">Comprendre le Cycle de l'Eau en Famille : Une Activité Simple et Ludique pour les 5èmes Années</text>

  <!-- Family activity element - Child figure -->
  <g transform="translate(100, 320)">
    <!-- Head -->
    <circle cx="0" cy="0" r="15" fill="#FFCC99" />
    <!-- Eyes -->
    <circle cx="-5" cy="-3" r="3" fill="#333" />
    <circle cx="5" cy="-3" r="3" fill="#333" />
    <!-- Mouth - happy smile -->
    <path d="M-7 5 Q0 12 7 5" stroke="#333" stroke-width="1.5" fill="none" />
    <!-- Hair -->
    <path d="M-12 -15 Q-5 -25 0 -15 T12 -15" fill="#A0522D" />
    <!-- Body -->
    <rect x="-10" y="10" width="20" height="30" rx="8" ry="8" fill="#66CCFF" />
    <!-- Left arm -->
    <rect x="-15" y="25" width="10" height="15" rx="5" ry="5" fill="#FFCC99" />
    <!-- Right arm pointing upwards -->
    <rect x="5" y="20" width="10" height="18" rx="5" ry="5" fill="#FFCC99" transform="rotate(-30 10 29)" />
    <!-- Child hand pointing upwards -->
    <circle cx="15" cy="18" r="5" fill="#FFCC99" transform="rotate(-30 10 29)" />
    <!-- Left leg -->
    <rect x="-7" y="40" width="7" height="15" rx="3" ry="3" fill="#A0522D" />
    <!-- Right leg -->
    <rect x="0" y="40" width="7" height="15" rx="3" ry="3" fill="#A0522D" />
  </g>

  <!-- A small house (for family context) -->
  <g transform="translate(60, 270)">
    <rect x="0" y="0" width="80" height="70" rx="10" ry="10" fill="#F4A460" /> <!-- Body of house -->
    <path d="M-10 0 L40 -40 L90 0 Z" fill="#D2691E" /> <!-- Roof -->
    <rect x="30" y="30" width="20" height="40" fill="#8B4513" /> <!-- Door -->
    <rect x="10" y="15" width="15" height="15" fill="#ADD8E6" /> <!-- Window 1 -->
    <rect x="55" y="15" width="15" height="15" fill="#ADD8E6" /> <!-- Window 2 -->
  </g>

  <!-- Title "Éveil Scientifique" -->
  <text x="30" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2E8B57">Éveil Scientifique</text>

</svg>