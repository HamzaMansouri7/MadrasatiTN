<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Corpus Document Card -->
  <rect x="40" y="36" width="176" height="184" rx="14" fill="#FBF8F1" stroke="#14251D" stroke-width="4"/>
