  <line x1="54" y1="90" x2="202" y2="90" stroke="#14251D" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Highlighted grammatical focus box -->
  <rect x="90" y="106" width="76" height="24" rx="5" fill="#F2C14E" fill-opacity="0.35" stroke="#8A5A00" stroke-width="2"/>
  <line x1="54" y1="118" x2="80" y2="118" stroke="#14251D" stroke-width="3.5" stroke-linecap="round"/>
