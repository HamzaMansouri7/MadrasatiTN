<div [dir]="lang.dir()" class="min-h-screen w-full max-w-full overflow-x-hidden bg-paper text-ink flex flex-col font-sans transition-colors">
  <app-navbar />

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    @switch (store.currentRole()) {
      @case ('home') {
        <app-landing-home />
      }
      @case ('teacher') {
        <app-teacher-home />
      }
      @case ('parent') {
        <app-parent-home />
      }
      @case ('student') {
        <app-student-home />
      }
      @case ('public') {
        <app-public-discovery />
      }
    }
  </main>

  <!-- Global Auth & Signup Modal -->
  <app-auth-modal />

  <!-- Footer -->
  <footer class="bg-white border-t border-[#E7DFCF] mt-12 py-8 text-xs text-[#5B6B60]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-[#1B4332] text-[#FBF8F1] font-display font-semibold flex items-center justify-center text-sm">
          م
        </div>
        <span class="font-display font-semibold text-[#14251D] text-sm">{{ lang.t('brandName') }} — {{ lang.t('brandSub') }}</span>
        <span class="text-[#1B4332] font-semibold bg-[#F2ECDE] border border-[#E7DFCF] px-2 py-0.5 rounded-md text-[10px]">
          {{ lang.t('freeBadge') }} 🇹🇳
        </span>
      </div>

      <p class="text-center md:text-right text-[11px] text-[#5B6B60]">
        {{ lang.t('tagline') }}
      </p>
    </div>
  </footer>
</div>
